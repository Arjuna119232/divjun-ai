plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
def kp = new Properties()
def kf = rootProject.file('keys.properties')
if (kf.exists()) kf.withInputStream { kp.load(it) }
def groqKey = System.getenv('GROQ_API_KEY') ?: kp.getProperty('GROQ_API_KEY', '')
def geminiKey = System.getenv('GEMINI_API_KEY') ?: kp.getProperty('GEMINI_API_KEY', '')

android {
    buildFeatures { buildConfig true }
    namespace 'com.divjun.ai'
    compileSdk 34
    defaultConfig {
        applicationId 'com.divjun.ai'
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName '1.8.0'
        buildConfigField 'String', 'GROQ_KEY', "\"${groqKey}\""
        buildConfigField 'String', 'GEMINI_KEY', "\"${geminiKey}\""
    }
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_PATH') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
